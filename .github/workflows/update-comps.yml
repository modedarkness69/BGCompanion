name: Update comps

# Раз в день пересобирает data/comps.json по свежей базе карт HearthstoneJSON:
# выбывшие из пула карты убираются, сборки на механики пересчитываются.
# Коммит делается только если сборки реально изменились.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Скачать базу карт
        run: |
          curl -sSL --retry 3 -o /tmp/cards_ru.json https://api.hearthstonejson.com/v1/latest/ruRU/cards.json
          curl -sSL --retry 3 -o /tmp/cards_en.json https://api.hearthstonejson.com/v1/latest/enUS/cards.json

      - name: Пересобрать сборки
        run: |
          python tools/gen_comps.py /tmp/cards_ru.json /tmp/generated.json
          python tools/build_comps.py /tmp/cards_en.json /tmp/generated.json data/comps.json

      - name: Закоммитить, если изменилось
        run: |
          if git diff --quiet data/comps.json; then echo "Изменений нет"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comps.json
          git commit -m "Автообновление сборок по базе карт"
          git push
